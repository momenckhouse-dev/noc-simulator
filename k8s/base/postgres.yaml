# A database needs its data to SURVIVE restarts, so it is a StatefulSet, not a Deployment.
# A StatefulSet gives the Pod a fixed name (postgres-0) and its own disk
# (a PersistentVolumeClaim) that stays even if the Pod is deleted.
# On AWS we will swap this for Amazon RDS (managed PostgreSQL).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: noc
            - name: POSTGRES_DB
              value: noc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            # Keep data in a sub-folder: some disks have a "lost+found" folder at the root
            # and PostgreSQL refuses to start in a non-empty folder.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "noc", "-d", "noc"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "noc", "-d", "noc"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  # "Give each Pod its own 1 GiB disk." Kubernetes creates the disk automatically.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
