# The database password lives in AWS Secrets Manager (RDS created it).
# External Secrets Operator (ESO) copies it into the Kubernetes Secret "postgres".

# SecretStore = WHERE the secrets are: AWS Secrets Manager in our region.
# No access keys here: ESO uses its Pod Identity role (terraform/secrets.tf).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
# ExternalSecret = WHAT to copy, and into which Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres
spec:
  refreshInterval: 1h               # re-check AWS every hour
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: postgres                  # the Secret the console already reads
    creationPolicy: Owner           # ESO creates it and deletes it with this object
    template:
      data:
        # The password goes inside a URL, so special characters must be escaped.
        POSTGRES_PASSWORD: "{{ .password | urlquery }}"
  data:
    - secretKey: password
      remoteRef:
        key: set-by-replacement     # the secret's ARN, from values.env
        property: password          # the RDS secret is JSON: {"username": ..., "password": ...}
