# Prometheus pulls ("scrapes") /metrics from every target every 10 seconds
# and checks the alert rules every 10 seconds.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: device-simulator
    static_configs:
      - targets: ["device-simulator:8000"]
  - job_name: noc-console
    static_configs:
      - targets: ["noc-console:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
